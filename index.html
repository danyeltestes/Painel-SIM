<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SIM SIM.23.01#1</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f8f5;
            --card-bg: #ffffff;
            --text-primary: #052e2e;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --sims-green-dark: #1a4a4a;
            --sims-green-vibrant: #4ade80;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }

        html.dark {
            --bg-color: #062626;
            --card-bg: #0c3e3e;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #4a6e6e;
            --sims-green-dark: #a7f3d0;
            --sims-green-vibrant: #34d399;
            --danger-bg: #450a0a;
            --danger-text: #fca5a5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-blur {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.7);
        }

        html.dark .nav-blur {
            background-color: rgba(6, 38, 38, 0.7);
        }

        .modal {
            transition: opacity 0.3s ease;
        }

        .modal-content {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-content {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #report-textarea {
            white-space: pre-wrap;
        }

        .reason-radio-label {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .reason-radio-label:hover {
            border-color: var(--sims-green-vibrant);
        }

        input[type="radio"]:checked + .reason-radio-label {
            background-color: var(--sims-green-dark);
            color: white;
            border-color: var(--sims-green-dark);
        }

        .tab-btn.active {
            color: var(--sims-green-dark);
            border-bottom: 2px solid var(--sims-green-vibrant);
        }

        html.dark .tab-btn.active {
            color: var(--sims-green-vibrant);
        }
    </style>
</head>
<body class="overscroll-none">
    <div id="loading-overlay" class="fixed inset-0 bg-[--bg-color] flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <svg class="animate-spin h-10 w-10 text-[--sims-green-vibrant]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-4 text-lg font-medium text-[--sims-green-dark]">Carregando Painel SIM...</p>
    </div>

    <main id="app-container" class="pb-24"></main>

    <div id="modal-container"></div>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 h-20 border-t border-[--border-color] nav-blur z-20">
        <div class="flex justify-around items-center h-full max-w-lg mx-auto">
            <button data-action="navigate" data-page="dashboard" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="users" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Moradores</span>
            </button>
            <button data-action="navigate" data-page="businesses" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="building-2" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Empresas</span>
            </button>
            <button data-action="navigate" data-page="more" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="menu" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Mais</span>
            </button>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, getDoc, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AlzaSyBQnBNk6vMfei9faYKsZCChz868RVrkwCE",
            authDomain: "simer-7de4c.firebaseapp.com", 
            projectId: "simer-7de4c", 
            storageBucket: "simer-7de4c.appspot.com", 
            messagingSenderId: "1061418170591", 
            appId: "1:1061418170591:web:fa815bfbf696ace55c116a" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let state = {
            currentPage: 'dashboard',
            residents: [],
            businesses: [],
            branches: [],
            closedRecords: [],
            parties: [],
            councils: [],
            laws: [], // Nova coleção de leis
            regions: [],
            electionHistory: [],
            customSectors: [],
            government: { roles: {}, ministries: [] },
            election: { isActive: false, candidates: [], votes: [], type: 'prefeito', ministryId: null, isTestMode: false, round: 1 },
            currentResidentId: null,
            currentBusinessId: null,
            currentPartyId: null,
            currentCouncilId: null,
            currentRegionId: null,
            currentBranchId: null,
            searchQuery: "",
            dataLoaded: { 
                residents: false, 
                businesses: false, 
                branches: false, 
                parties: false, 
                councils: false, 
                laws: false,
                regions: false, 
                governmentRoles: false, 
                governmentConfig: false, 
                election: false,
                electionHistory: false,
                customSectors: false,
                closedRecords: false
            },
            initialRenderDone: false,
            charts: {},
            activeStudentTab: 'ativos'
        };

        const currentVersion = 'SIM.23.01#1';
        const lifeStages = ['Bebê', 'Criança', 'Pré-adolescente', 'Adolescente', 'Adulto', 'Idoso'];
        const genders = ['Homem', 'Mulher', 'Homem Trans', 'Mulher Trans', 'Não-Binário'];
        const ethnicities = ['Asiático(a)', 'Branco(a)', 'Pardo(a)', 'Negro(a)'];
        // Atualizado com novas opções de relacionamento
        const relationshipTypes = ['Cônjuge', 'Pai', 'Mãe', 'Filho(a)', 'Filho(a) Adotivo(a)', 'Afilhado(a)', 'Irmão(ã)', 'Tio(a)', 'Sobrinho(a)', 'Padrasto', 'Madrasta', 'Enteado(a)', 'Meio-irmão(ã)', 'Namorado(a)', 'Noivo(a)', 'Ex-Parceiro(a)', 'Avô(ó)', 'Neto(a)'];
        const defaultBusinessSectors = ['Varejo', 'Alimentação', 'Tecnologia', 'Saúde', 'Educação', 'Serviços', 'Entretenimento', 'Indústria', 'Governamental', 'Finanças', 'Esporte / Clube', 'Hotelaria'];
        const politicalSpectrums = ['Direita', 'Centro', 'Esquerda'];
        const defaultMinistries = [{ id: 'prefeito', name: 'Prefeito(a)', fixed: true }];
        const institutionTypes = ['Escola', 'Curso Técnico', 'Universidade', 'Instituto'];
        const studentStatuses = ['Cursando', 'Formado(a)', 'Expulso(a)', 'Trancado'];
        const jobRemovalReasons = ['Apenas remoção', 'Pediu demissão', 'Demitido(a)', 'Contrato concluído', 'Transferido(a)', 'Aposentado(a)'];
        const govRemovalReasons = ['Apenas remoção', 'Mandato Concluído', 'Impeachmado(a)', 'Aposentado(a)'];
        const councilRemovalReasons = ['Apenas remoção', 'Renunciou', 'Fim de Mandato', 'Expulso(a)'];
        const removalOptions = ['Se mudou', 'Morreu', 'Apenas remover'];
        const businessRemovalOptions = ['Apenas Remoção', 'Falência', 'Encerramento'];
        const lawRemovalReasons = ['Apenas Remoção', 'Revogada', 'Vetada', 'Expirada'];

        function render() {
            destroyCharts();
            const appContainer = document.getElementById('app-container');
            const currentPageHTML = getPageHTML();
            if (appContainer.innerHTML !== currentPageHTML) {
                appContainer.innerHTML = currentPageHTML;
            }
            updateListPage();
            if (state.currentPage === 'census-data') {
                renderCharts();
            }
            updateActiveNav();
            lucide.createIcons();
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = state.searchQuery;
            }
        }

        function getPageHTML() {
            switch (state.currentPage) {
                case 'dashboard': return DashboardPage();
                case 'businesses': return BusinessesPage();
                case 'more': return MorePage();
                case 'politics': return PoliticsPage();
                case 'register': return RegisterPage();
                case 'settings': return SettingsPage();
                case 'regions': return RegionsPage();
                case 'census-data': return CensusDataPage();
                case 'resident-profile': return ResidentProfilePage();
                case 'business-profile': return BusinessProfilePage();
                case 'branch-profile': return BranchProfilePage();
                case 'party-profile': return PartyProfilePage();
                case 'council-profile': return CouncilProfilePage();
                case 'region-profile': return RegionProfilePage();
                default: return ErrorPage('Página não encontrada', 'dashboard');
            }
        }

        function updateListPage() {
            if (['dashboard', 'businesses', 'regions', 'politics'].includes(state.currentPage)) {
                const listContainer = document.getElementById('list-container');
                if (listContainer) {
                    let content = "";
                    if (state.currentPage === 'dashboard') {
                        const filteredResidents = state.residents.filter(r => !r.isDeceased && `${r.firstName} ${r.lastName}`.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredResidents.length > 0 ? filteredResidents.map(sim => ResidentCard(sim)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum cidadão encontrado.</p>`;
                    } else if (state.currentPage === 'businesses') {
                        const filteredBusinesses = state.businesses.filter(b => b.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredBusinesses.length > 0 ? filteredBusinesses.map(biz => BusinessCard(biz)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhuma empresa encontrada.</p>`;
                    } else if (state.currentPage === 'regions') {
                        const filteredRegions = state.regions.filter(r => r.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredRegions.length > 0 ? filteredRegions.map(reg => RegionCard(reg)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhuma região encontrada.</p>`;
                    }
                    listContainer.innerHTML = content;
                }

                if (state.currentPage === 'politics') {
                    const partiesContainer = document.getElementById('parties-list-container');
                    if (partiesContainer) {
                        const filteredParties = state.parties.filter(p => p.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        const partyContent = filteredParties.length > 0 ? filteredParties.map(party => PartyCard(party)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum partido encontrado.</p>`;
                        partiesContainer.innerHTML = partyContent;
                    }
                    const councilsContainer = document.getElementById('councils-list-container');
                    if (councilsContainer) {
                        const councilContent = state.councils.length > 0 ? state.councils.map(council => CouncilCard(council)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum conselho criado.</p>`;
                        councilsContainer.innerHTML = councilContent;
                    }
                }
            }
            lucide.createIcons();
        }

        const ResidentCard = (sim) => {
            let statusIcons = "";
            if (sim.employment && sim.employment.length > 0) statusIcons += '<i data-lucide="briefcase" class="inline-block h-4 w-4 mr-1 text-blue-500"></i>';
            if (sim.governmentRole || (sim.councilRoles && sim.councilRoles.length > 0)) statusIcons += '<i data-lucide="landmark" class="inline-block h-4 w-4 mr-1 text-purple-500"></i>';
            if (sim.education && sim.education.some(e => e.status === 'Cursando')) statusIcons += '<i data-lucide="graduation-cap" class="inline-block h-4 w-4 mr-1 text-green-500"></i>';
            const deceasedTag = sim.isDeceased ? ' <span class="text-[10px] font-extrabold bg-gray-200 text-gray-600 px-1 rounded ml-1">FALECIDO(A)</span>' : "";
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="resident" data-id="${sim.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${statusIcons}${sim.firstName} ${sim.lastName}${deceasedTag}</h4>
                <p class="text-sm text-[--text-secondary]">${sim.lifeStage || 'Fase da vida não definida'}</p>
            </div>`;
        };

        const BusinessCard = (biz) => {
            const employeeCount = state.residents.filter(r => !r.isDeceased && r.employment?.some(job => job.businessId === biz.id)).length;
            let subtext = biz.sector;
            if (biz.sector === 'Educação') subtext = biz.institutionType || 'Educação';
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="business" data-id="${biz.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${biz.name}</h4>
                <p class="text-sm text-[--text-secondary]">${subtext}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Funcionários: ${employeeCount}</p>
            </div>`;
        };

        const BranchCard = (branch) => {
            const sede = state.businesses.find(b => b.id === branch.parentBusinessId);
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="branch" data-id="${branch.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${branch.name}</h4>
                <p class="text-xs uppercase font-bold text-[--text-secondary]">Unidade de ${sede?.name || 'Sede'}</p>
            </div>`;
        };

        const PartyCard = (party) => {
            const president = state.residents.find(r => r.id === party.presidentId);
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="party" data-id="${party.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${party.name}</h4>
                <p class="text-sm text-[--text-secondary]">${party.spectrum}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Presidente: ${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p>
            </div>`;
        };

        const CouncilCard = (council) => {
            const president = state.residents.find(r => r.id === council.presidentId);
            const councilorCount = council.councilorIds?.length || 0;
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="council" data-id="${council.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${council.name}</h4>
                <p class="text-sm text-[--text-secondary]">Presidente: ${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Conselheiros: ${councilorCount}</p>
            </div>`;
        };

        const RegionCard = (region) => {
            const residentCount = state.residents.filter(r => !r.isDeceased && r.regionId === region.id).length;
            const businessCount = state.businesses.filter(b => b.regionId === region.id).length;
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="region" data-id="${region.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${region.name}</h4>
                <div class="text-sm text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color] grid grid-cols-2 gap-2">
                    <span><i data-lucide="users" class="inline-block h-4 w-4 mr-1"></i> ${residentCount}</span>
                    <span><i data-lucide="building-2" class="inline-block h-4 w-4 mr-1"></i> ${businessCount}</span>
                </div>
            </div>`;
        };

        function DashboardPage() {
            const activeResidents = state.residents.filter(r => !r.isDeceased);
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Painel SIM', 'O painel de controle da sua cidade.', currentVersion)}</header>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-3xl text-[--sims-green-dark]">${activeResidents.length}</h3><p class="text-sm text-[--text-secondary]">Moradores Ativos</p></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-3xl text-[--sims-green-dark]">${state.businesses.length}</h3><p class="text-sm text-[--text-secondary]">Empresas</p></div>
                </div>
                <div>
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark] mb-4">Cidadãos</h2>
                    ${SearchComponent('morador')}
                    <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
            ${FABComponent('add-resident')}`;
        }

        function BusinessesPage() {
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Empresas e Comércio', 'Gerencie a economia da sua cidade.', currentVersion)}</header>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark]">Estabelecimentos</h2>
                    <button data-action="open-modal" data-modal-type="manage-sectors" class="text-sm bg-[--border-color] px-3 py-1 rounded-md">Setores Personalizados</button>
                </div>
                ${SearchComponent('empresa')}
                <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
            ${FABComponent('add-business')}`;
        }

        function MorePage() {
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Mais Opções', 'Explore outras áreas da sua cidade.', currentVersion)}</header>
                <div class="grid grid-cols-2 gap-4">
                    <button data-action="navigate" data-page="politics" class="bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex flex-col items-center justify-center aspect-square hover:shadow-lg hover:-translate-y-1 transition-all"><i data-lucide="scale" class="h-10 w-10 mb-2 text-[--sims-green-vibrant]"></i><span class="font-semibold text-center">Política</span></button>
                    <button data-action="navigate" data-page="register" class="bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex flex-col items-center justify-center aspect-square hover:shadow-lg hover:-translate-y-1 transition-all"><i data-lucide="file-text" class="h-10 w-10 mb-2 text-[--sims-green-vibrant]"></i><span class="font-semibold text-center">Registro</span></button>
                    <button data-action="navigate" data-page="settings" class="bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex flex-col items-center justify-center aspect-square hover:shadow-lg hover:-translate-y-1 transition-all"><i data-lucide="settings" class="h-10 w-10 mb-2 text-[--sims-green-vibrant]"></i><span class="font-semibold text-center">Configurações</span></button>
                    <button data-action="navigate" data-page="regions" class="bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex flex-col items-center justify-center aspect-square hover:shadow-lg hover:-translate-y-1 transition-all"><i data-lucide="map-pinned" class="h-10 w-10 mb-2 text-[--sims-green-vibrant]"></i><span class="font-semibold text-center">Regiões</span></button>
                </div>
                <div class="mt-4">
                    <button data-action="navigate" data-page="census-data" class="w-full bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex items-center justify-center gap-4 hover:shadow-lg hover:-translate-y-1 transition-all">
                        <i data-lucide="pie-chart" class="h-10 w-10 text-[--sims-green-vibrant]"></i>
                        <span class="font-semibold text-center text-lg">Dados de Censo</span>
                    </button>
                </div>
            </div>`;
        }

        function PoliticsPage() {
            const ministries = [...defaultMinistries, ...(state.government.ministries || [])];
            const governmentHTML = ministries.map(min => {
                const holder = state.residents.find(r => r.id === state.government.roles?.[min.id]);
                const buttonHTML = holder ? `<button data-action="open-modal" data-modal-type="remove-minister-reason" data-office-id="${min.id}" data-office-name="${min.name}" data-resident-id="${holder.id}" class="text-sm bg-[--danger-bg] text-[--danger-text] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Remover</button>` : `<button data-action="open-modal" data-modal-type="appoint-minister" data-office-id="${min.id}" data-office-name="${min.name}" class="text-sm bg-[--border-color] text-[--text-primary] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Nomear</button>`;
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]">
                    <div><p class="font-semibold">${min.name}</p><p class="text-sm ${holder ? 'text-[--text-secondary]' : 'text-gray-400 italic'}">${holder ? `${holder.firstName} ${holder.lastName}` : 'Cargo Vago'}</p></div>
                    ${buttonHTML}
                </div>`;
            }).join("");

            let electionHTML = "";
            if (state.election.isActive) {
                const candidatesHTML = (state.election.candidates || []).map(cand => {
                    const sim = state.residents.find(r => r.id === cand.id);
                    const party = state.parties.find(p => p.id === sim?.partyId);
                    return `<div class="p-3 bg-[--bg-color] rounded-md border border-[--border-color] flex justify-between items-center">
                        <div>
                            <p class="font-semibold">${sim ? `${sim.firstName} ${sim.lastName}` : 'Candidato desconhecido'}</p>
                            <p class="text-[10px] text-[--text-secondary] uppercase font-bold">${party ? party.name : 'Sem Partido'}</p>
                        </div>
                    </div>`;
                }).join("");

                const typeText = state.election.type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${state.election.ministryName})`;
                const testTag = state.election.isTestMode ? '<span class="ml-2 text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full uppercase font-bold">Modo Teste</span>' : '';
                const roundText = state.election.round === 2 ? '<span class="ml-2 text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full uppercase font-bold">2º Turno</span>' : '<span class="ml-2 text-[10px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full uppercase font-bold">1º Turno</span>';
                const totalVotes = state.election.votes?.length || 0;

                electionHTML = `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-bold text-lg">Eleição Ativa: ${typeText}${testTag}${roundText}</h3>
                            <p class="text-xs text-[--text-secondary]">Total de Votos: ${totalVotes}</p>
                        </div>
                        <button data-action="end-election" class="text-xs bg-[--danger-bg] text-[--danger-text] px-2 py-1 rounded-md hover:bg-opacity-80">Cancelar</button>
                    </div>
                    
                    <div class="space-y-2 mb-4">${candidatesHTML || '<p class="text-sm italic text-center py-2">Sem candidatos.</p'}</div>
                    
                    <div class="grid grid-cols-1 gap-2 mb-4">
                        ${state.election.round === 1 ? `<button data-action="open-modal" data-modal-type="add-candidate" class="w-full text-sm bg-[--border-color] text-[--text-primary] py-2 rounded-lg font-semibold">Adicionar Candidato</button>` : ''}
                        <button data-action="open-modal" data-modal-type="register-vote" class="w-full text-sm bg-[--sims-green-vibrant] text-white py-2 rounded-lg font-semibold">Registrar Voto</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button data-action="generate-election-report" class="w-full text-xs bg-gray-200 py-2 rounded-lg font-bold">Ver Parcial</button>
                        ${state.election.round === 1 ? 
                            `<button data-action="open-modal" data-modal-type="setup-second-round" class="w-full text-sm bg-yellow-500 text-white py-2 rounded-lg font-semibold hover:bg-yellow-600">Ir para 2º Turno</button>` : ''
                        }
                    </div>
                    <button data-action="open-modal" data-modal-type="declare-winner" class="w-full mt-2 text-sm bg-[--sims-green-dark] text-white py-2 rounded-lg font-semibold">Declarar Vencedor</button>
                </div>`;
            } else {
                electionHTML = `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] flex justify-between items-center"><p>Nenhuma eleição ativa.</p><button data-action="open-modal" data-modal-type="start-election-setup" class="bg-[--sims-green-vibrant] text-white px-4 py-2 rounded-lg font-semibold">Iniciar Nova Eleição</button></div>`;
            }

            const historyHTML = state.electionHistory.map(hist => {
                const winner = state.residents.find(r => r.id === hist.winnerId);
                const typeLabel = hist.type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${hist.ministryName})`;
                const roundLabel = hist.round === 2 ? '(2º Turno)' : '(1º Turno)';
                return `<div class="p-3 bg-[--card-bg] border border-[--border-color] rounded-lg mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm">${typeLabel} ${roundLabel}</p>
                        <p class="text-xs">Vencedor: ${winner ? `${winner.firstName} ${winner.lastName}` : 'Desconhecido'} (${hist.winnerVotes} votos)</p>
                        <p class="text-[10px] text-[--text-secondary]">${new Date(hist.date?.seconds * 1000).toLocaleString('pt-BR')}</p>
                    </div>
                    <button data-action="delete-election-history" data-id="${hist.id}" class="text-red-500 p-2"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                </div>`;
            }).reverse().join("");

            const lawsHTML = (state.laws || []).map(law => {
                const decretou = state.residents.find(r => r.id === law.proclaimedById);
                return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-lg text-[--sims-green-dark]">${law.title}</h4>
                            <p class="text-sm text-[--text-secondary]">${law.description}</p>
                        </div>
                        <button data-action="open-modal" data-modal-type="remove-law" data-id="${law.id}" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                    </div>
                    <div class="mt-2 pt-2 border-t border-[--border-color] text-xs text-[--text-secondary]">
                        <p><strong>Autores:</strong> ${(law.authorIds || []).map(id => {
                            const a = state.residents.find(r => r.id === id);
                            return a ? `${a.firstName} ${a.lastName}` : 'Desconhecido';
                        }).join(", ")}</p>
                        <p class="mt-1"><strong>Decretado por:</strong> ${decretou ? `${decretou.firstName} ${decretou.lastName}` : 'Ninguém'}</p>
                    </div>
                </div>`;
            }).join("");

            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header>${HeaderComponent('Cenário Político', 'Gerencie o governo e os partidos.', currentVersion)}</header>
                <section>
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold text-[--sims-green-dark]">Poder Executivo</h2><button data-action="open-modal" data-modal-type="manage-ministries" class="text-sm bg-[--border-color] text-[--text-primary] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Gerenciar</button></div>
                    <div class="space-y-2">${governmentHTML}</div>
                </section>
                <section>
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold text-[--sims-green-dark]">Conselhos</h2><button data-action="open-modal" data-modal-type="add-council" class="text-sm bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full font-semibold hover:bg-green-500 flex items-center gap-1"><i data-lucide="plus" class="h-4 w-4"></i> Criar</button></div>
                    <div id="councils-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </section>
                <section>
                     <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold text-[--sims-green-dark]">Legislação Municipal</h2><button data-action="open-modal" data-modal-type="add-law" class="text-sm bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full font-semibold hover:bg-green-500 flex items-center gap-1"><i data-lucide="scroll-text" class="h-4 w-4"></i> Nova Lei</button></div>
                     <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${lawsHTML || '<p class="text-center italic text-[--text-secondary] py-4 col-span-full">Nenhuma lei registrada.</p>'}</div>
                </section>
                <section>
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark] mb-4">Eleições</h2>
                    ${electionHTML}
                    <div class="mt-6">
                        <h3 class="font-bold text-lg mb-4 text-[--sims-green-dark]">Histórico de Eleições</h3>
                        <div class="space-y-2">${historyHTML || '<p class="text-sm italic text-center text-[--text-secondary] py-4">Nenhum histórico registrado.</p'}</div>
                    </div>
                </section>
                 <section>
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold text-[--sims-green-dark]">Partidos Políticos</h2><button data-action="open-modal" data-modal-type="add-party" class="text-sm bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full font-semibold hover:bg-green-500 flex items-center gap-1"><i data-lucide="plus" class="h-4 w-4"></i> Criar</button></div>
                    ${SearchComponent('partido')}
                    <div id="parties-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </section>
            </div>`;
        }

        function RegisterPage() {
            return `<div class="page-content p-4 md:p-6 space-y-4">
                <header>${HeaderComponent('Gerador de Registros', 'Relatórios detalhados da sua cidade.', currentVersion)}</header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button data-action="generate-report" data-report-type="residents" class="bg-[--sims-green-dark] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition"><i data-lucide="users"></i> Relatório de Moradores</button>
                    <button data-action="generate-report" data-report-type="businesses" class="bg-[--sims-green-dark] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition"><i data-lucide="building-2"></i> Relatório de Empresas</button>
                    <button data-action="generate-report" data-report-type="politics" class="bg-[--sims-green-dark] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition"><i data-lucide="landmark"></i> Relatório Político</button>
                    <button data-action="generate-report" data-report-type="obituary" class="bg-[--danger-text] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-opacity-90 transition"><i data-lucide="skull"></i> Obituário Oficial</button>
                </div>
                <div id="report-output" class="hidden mt-6">
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark] mb-4">Relatório Gerado</h2>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                        <textarea id="report-textarea" readonly class="w-full h-96 p-2 border rounded-md bg-[--bg-color] text-[--text-primary] no-scrollbar"></textarea>
                        <button id="copy-report-btn" data-action="copy-report" class="mt-4 w-full bg-[--sims-green-vibrant] text-white py-2 rounded-lg font-semibold hover:bg-green-500 flex items-center justify-center gap-2"><i data-lucide="copy" class="h-5 w-5"></i> Copiar Texto</button>
                    </div>
                </div>
            </div>`;
        }

        function RegionsPage() {
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Regiões', 'Gerencie as áreas da sua cidade.', currentVersion)}</header>
                <h2 class="text-2xl font-semibold text-[--sims-green-dark] mb-4">Mapa da Cidade</h2>
                ${SearchComponent('região')}
                <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
            ${FABComponent('add-region')}`;
        }

        function CensusDataPage() {
            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header>${HeaderComponent('Dados de Censo', 'Análise demográfica e econômica da cidade.', currentVersion)}</header>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">População por Faixa Etária</h3><canvas id="age-chart"></canvas></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">População por Gênero</h3><canvas id="gender-chart"></canvas></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">População por Etnia</h3><canvas id="ethnicity-chart"></canvas></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">População por Região</h3><canvas id="region-chart"></canvas></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] lg:col-span-2"><h3 class="font-bold text-lg mb-2">Empresas por Setor</h3><canvas id="business-sector-chart"></canvas></div>
                </div>
            </div>`;
        }

        function SettingsPage() {
            const totalResidents = state.residents.length;
            const totalBusinesses = state.businesses.length;
            const totalRecords = totalResidents + totalBusinesses + state.branches.length + state.parties.length + state.councils.length + state.regions.length;
            const recordLimit = 50000;
            const usagePercentage = Math.min((totalRecords / recordLimit) * 100, 100);
            const residentListHTML = state.residents.map(r => `<div class="flex justify-between items-center p-2 hover:bg-[--border-color] rounded-md"><span>${r.firstName} ${r.lastName} ${r.isDeceased ? '(†)' : ''}</span><button data-action="open-modal" data-modal-type="confirm-removal" data-id="${r.id}" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`).join("");
            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header><button data-action="navigate" data-page="more" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Mais</button>${HeaderComponent('Configurações', 'Gerencie seu aplicativo e dados.', currentVersion)}</header>
                <section class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">Uso de Dados</h3><div class="w-full bg-[--border-color] rounded-full h-2.5 mb-2"><div class="bg-[--sims-green-vibrant] h-2.5 rounded-full" style="width: ${usagePercentage}%"></div></div><p class="text-right text-sm font-medium text-[--text-secondary]">${totalRecords} Registros</p></section>
                <section class="border-2 border-red-500/50 rounded-lg p-4"><h3 class="font-bold text-lg text-red-500 mb-2">Zona de Perigo</h3><div class="h-64 overflow-y-auto p-2 bg-[--bg-color] rounded-md border border-[--border-color] no-scrollbar">${residentListHTML || '<p class="text-center text-sm italic py-4">Sem registros.</p>'}</div></section>
            </div>`;
        }

        function ResidentProfilePage() {
            const sim = state.residents.find(r => r.id === state.currentResidentId);
            if (!sim) return ErrorPage('Morador não encontrado.', 'dashboard');
            const deceasedHeader = sim.isDeceased ? `<div class="bg-red-50 text-red-700 p-4 rounded-lg border border-red-200 mb-4 flex items-center gap-3"><i data-lucide="skull"></i> <div><p class="font-bold">FALECIDO(A)</p><p class="text-xs">Falecimento: ${new Date(sim.deathDate?.seconds * 1000).toLocaleDateString('pt-BR')}</p></div></div>` : "";
            const relationshipsHTML = (sim.relationships || []).map((rel, idx) => {
                const relatedSim = state.residents.find(r => r.id === rel.residentId);
                const tag = relatedSim?.isDeceased ? ' <span class="text-[10px] font-bold text-red-500 uppercase">(Falecido/a)</span>' : "";
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><span><strong>${rel.type}:</strong> ${relatedSim ? `${relatedSim.firstName} ${relatedSim.lastName}` : 'Desconhecido'} ${tag}</span><button data-action="delete-relationship" data-sim-a-id="${sim.id}" data-rel-index="${idx}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`;
            }).join("");

            let employmentHTML = '<p class="text-[--text-secondary] italic text-center py-4">Desempregado(a)</p>';
            if (sim.employment && sim.employment.length > 0) {
                employmentHTML = sim.employment.map(job => {
                    const business = state.businesses.find(b => b.id === job.businessId);
                    const branch = state.branches.find(br => br.id === job.branchId);
                    const localStr = branch ? `na filial <strong>${branch.name}</strong>` : `na <strong>Sede</strong>`;
                    return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]">
                        <div><p><strong>${job.position}</strong></p><p class="text-sm text-[--text-secondary]">${localStr} de <strong class="text-[--sims-green-dark]">${business ? business.name : 'Empresa Desconhecida'}</strong></p></div>
                        <button data-action="open-modal" data-modal-type="remove-employee-reason" data-resident-id="${sim.id}" data-business-id="${job.businessId}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="user-minus" class="h-4 w-4"></i></button>
                    </div>`;
                }).join("");
            }

            let politicsHTML = "";
            if (sim.governmentRole) politicsHTML += `<p><strong class="block text-sm text-[--text-secondary]">Cargo Público:</strong> ${sim.governmentRole}</p>`;
            if (sim.councilRoles && sim.councilRoles.length > 0) {
                sim.councilRoles.forEach(role => {
                    politicsHTML += `<p class="mt-2"><strong class="block text-sm text-[--text-secondary]">${role.role} do(a):</strong> ${role.councilName}</p>`;
                });
            }
            if (sim.partyId) {
                const party = state.parties.find(p => p.id === sim.partyId);
                politicsHTML += `<p class="mt-2"><strong class="block text-sm text-[--text-secondary]">Partido:</strong> ${party ? party.name : 'Desconhecido'}</p>`;
            }
            if (!politicsHTML) politicsHTML = '<p class="text-[--text-secondary] italic">Nenhuma afiliação política.</p>';

            const region = state.regions.find(r => r.id === sim.regionId);
            const educationHTML = (sim.education || []).map(edu => {
                const business = state.businesses.find(b => b.id === edu.businessId);
                return `<div class="p-3 bg-[--bg-color] rounded-md border border-[--border-color]"><p class="font-semibold">${edu.course}</p><p class="text-sm text-[--text-secondary]">${business ? business.name : 'Instituição Desconhecida'}</p><p class="text-xs font-bold uppercase mt-2 ${edu.status === 'Cursando' ? 'text-blue-500' : edu.status === 'Formado(a)' ? 'text-green-500' : 'text-red-500'}">${edu.status}</p></div>`;
            }).join("");

            const history = (sim.history || []).sort((a, b) => (a.date?.seconds || 0) - (b.date?.seconds || 0));
            const historyHTML = history.map(entry => `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><div><p><strong>${entry.status}</strong></p><p class="text-sm text-[--text-secondary]">${entry.type === 'job' ? 'da empresa' : 'do cargo de'} <strong>${entry.location}</strong></p></div><button data-action="delete-history-entry" data-resident-id="${sim.id}" data-history-id="${entry.id}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`).join("");

            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="navigate" data-page="dashboard" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para a lista</button>
                ${deceasedHeader}
                <div class="flex justify-between items-start">
                    <div><h1 class="text-3xl font-bold text-[--sims-green-dark]">${sim.firstName} ${sim.lastName}</h1><p class="text-[--text-secondary]">${sim.lifeStage}</p></div>
                    <div class="flex items-center gap-2">
                        <button data-action="open-modal" data-modal-type="edit-resident" data-id="${sim.id}" class="bg-[--border-color] text-[--text-primary] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-removal" data-id="${sim.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg text-sm font-semibold hover:bg-red-200 dark:hover:bg-red-800/50 transition"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="grid grid-cols-2 gap-4"><div class="bg-[--card-bg] p-3 rounded-lg shadow-sm border border-[--border-color]"><strong class="block text-sm text-[--text-secondary]">Gênero</strong> ${sim.gender}</div><div class="bg-[--card-bg] p-3 rounded-lg shadow-sm border border-[--border-color]"><strong class="block text-sm text-[--text-secondary]">Etnia</strong> ${sim.ethnicity || 'Não definida'}</div><div class="bg-[--card-bg] p-3 rounded-lg shadow-sm border border-[--border-color] col-span-2"><strong class="block text-sm text-[--text-secondary]">Região</strong> ${region ? region.name : 'Não especificada'}</div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-2"><h3 class="font-semibold text-lg">Ocupações</h3>${!sim.isDeceased ? `<button data-action="open-modal" data-modal-type="add-job" data-id="${sim.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-sm font-semibold hover:bg-green-500 transition"><i data-lucide="plus" class="h-4 w-4"></i> Adicionar</button>` : ""}</div><div class="space-y-2">${employmentHTML}</div></div>
                ${(sim.education && sim.education.length > 0) ? `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Educação</h3><div class="space-y-2">${educationHTML}</div></div>` : ""}
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Vida Política</h3>${politicsHTML}</div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Histórico</h3><div class="space-y-2">${historyHTML.length ? historyHTML : '<p class="text-[--text-secondary] italic text-center py-4">Nenhum histórico profissional ou político.</p'}</div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-2"><h3 class="font-semibold text-lg">Relações</h3><button data-action="open-modal" data-modal-type="add-relationship" data-id="${sim.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-sm font-semibold hover:bg-green-500 flex items-center gap-1 transition"><i data-lucide="plus" class="h-4 w-4"></i> Adicionar</button></div><div class="space-y-2">${relationshipsHTML.length ? relationshipsHTML : '<p class="text-[--text-secondary] italic text-center py-4">Nenhuma relação cadastrada.</p>'}</div></div>
            </div>`;
        }

        function BusinessProfilePage() {
            const biz = state.businesses.find(b => b.id === state.currentBusinessId);
            if (!biz) return ErrorPage('Empresa não encontrada.', 'businesses');
            const owner = state.residents.find(r => r.id === biz.ownerId);
            const region = state.regions.find(r => r.id === biz.regionId);
            const myBranches = state.branches.filter(br => br.parentBusinessId === biz.id);
            const employees = state.residents.filter(r => !r.isDeceased && r.employment?.some(job => job.businessId === biz.id && !job.branchId));

            const employeesHTML = employees.map(emp => {
                const job = emp.employment.find(j => j.businessId === biz.id && !j.branchId);
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><div><p class="font-semibold">${emp.firstName} ${emp.lastName}</p><p class="text-sm text-[--text-secondary]">${job.position}</p></div><button data-action="open-modal" data-modal-type="remove-employee-reason" data-resident-id="${emp.id}" data-business-id="${biz.id}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="user-minus" class="h-4 w-4"></i></button></div>`;
            }).join("");

            let educationSectionHTML = "";
            if (biz.sector === 'Educação') {
                const students = state.residents.filter(r => r.education?.some(e => e.businessId === biz.id));
                const activeStudents = students.filter(s => s.education.find(e => e.businessId === biz.id).status === 'Cursando');
                const graduatedStudents = students.filter(s => s.education.find(e => e.businessId === biz.id).status === 'Formado(a)');
                const currentList = state.activeStudentTab === 'ativos' ? activeStudents : graduatedStudents;
                educationSectionHTML = `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-4"><h3 class="font-semibold text-lg">Alunos</h3><button data-action="open-modal" data-modal-type="add-student" data-id="${biz.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-sm font-semibold hover:bg-green-500 transition">+ Matricular</button></div><div class="flex border-b border-[--border-color] mb-4"><button data-action="set-student-tab" data-tab="ativos" class="tab-btn py-2 px-4 text-sm font-semibold transition ${state.activeStudentTab === 'ativos' ? 'active' : 'text-[--text-secondary]'}">Ativos (${activeStudents.length})</button><button data-action="set-student-tab" data-tab="formados" class="tab-btn py-2 px-4 text-sm font-semibold transition ${state.activeStudentTab === 'formados' ? 'active' : 'text-[--text-secondary]'}">Formados (${graduatedStudents.length})</button></div><div class="space-y-2">${currentList.length ? currentList.map(stu => `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><div><p class="font-semibold">${stu.firstName} ${stu.lastName}</p><p class="text-xs text-[--text-secondary]">${stu.education.find(e => e.businessId === biz.id).course}</p></div><button data-action="remove-student" data-resident-id="${stu.id}" data-business-id="${biz.id}" class="text-red-500"><i data-lucide="user-minus" class="h-4 w-4"></i></button></div>`).join("") : '<p class="text-center italic py-4">Nenhum aluno.</p>'}</div></div>`;
            }

            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="navigate" data-page="businesses" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para a lista</button>
                <div class="flex justify-between items-start">
                    <div><h1 class="text-3xl font-bold text-[--sims-green-dark]">${biz.name}</h1><p class="text-[--text-secondary]">${biz.institutionType ? `${biz.sector} - ${biz.institutionType}` : biz.sector}</p></div>
                    <div class="flex items-center gap-2">
                        <button data-action="open-modal" data-modal-type="edit-business" data-id="${biz.id}" class="bg-[--border-color] text-[--text-primary] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-delete-business" data-id="${biz.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg text-sm font-semibold hover:bg-red-200 transition"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-2"><h3 class="font-semibold text-lg">Informações</h3>${biz.sector === 'Educação' ? `<button data-action="open-modal" data-modal-type="manage-courses" data-id="${biz.id}" class="text-sm bg-[--border-color] text-[--text-primary] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Gerenciar Cursos</button>` : ""}</div><p><strong class="block text-sm text-[--text-secondary]">Proprietário(a):</strong> ${owner ? `${owner.firstName} ${owner.lastName}` : 'Pública'}</p><p class="mt-2"><strong class="block text-sm text-[--text-secondary]">Região:</strong> ${region ? region.name : 'Não especificada'}</p></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-3"><h3 class="font-semibold text-lg text-[--sims-green-dark]">Unidades e Filiais</h3><button data-action="open-modal" data-modal-type="add-branch" data-id="${biz.id}" class="bg-[--sims-green-dark] text-white px-3 py-1 rounded-full text-xs font-bold">+ Adicionar Unidade</button></div><div class="space-y-2">${branchesHTML || '<p class="text-sm italic text-[--text-secondary] text-center py-2">Nenhuma filial cadastrada.</p'}</div></div>

                ${educationSectionHTML}
            </div>`;
        }

        function BranchProfilePage() {
            const branch = state.branches.find(b => b.id === state.currentBranchId);
            if (!branch) return ErrorPage('Unidade não encontrada.', 'businesses');
            const sede = state.businesses.find(b => b.id === branch.parentBusinessId);
            const manager = state.residents.find(r => r.id === branch.managerId);
            const employees = state.residents.filter(r => !r.isDeceased && r.employment?.some(j => j.branchId === branch.id));
            const employeesHTML = employees.map(emp => {
                const job = emp.employment.find(j => j.branchId === branch.id);
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><div><p class="font-semibold">${emp.firstName} ${emp.lastName}</p><p class="text-xs text-[--text-secondary]">${job.position}</p></div><button data-action="open-modal" data-modal-type="remove-employee-reason" data-resident-id="${emp.id}" data-business-id="${branch.parentBusinessId}" class="text-red-500"><i data-lucide="user-minus" class="h-4 w-4"></i></button></div>`;
            }).join("");

            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="view-profile" data-type="business" data-id="${branch.parentBusinessId}" class="flex items-center text-sm font-semibold mb-4 text-[--sims-green-dark]"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Sede</button>
                <div class="flex justify-between items-start">
                    <div><h1 class="text-3xl font-bold text-[--sims-green-dark]">${branch.name}</h1><p class="text-[--text-secondary]">Unidade de ${sede?.name}</p></div>
                    <div class="flex gap-2">
                        <button data-action="open-modal" data-modal-type="edit-branch" data-id="${branch.id}" class="bg-[--border-color] px-4 py-2 rounded-lg text-sm font-semibold">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-delete-branch" data-id="${branch.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg text-[--sims-green-dark]">Gerência</h3><p>${manager ? `${manager.firstName} ${manager.lastName}` : 'Indefinido'}</p></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <div class="flex justify-between items-center mb-3"><h3 class="font-semibold text-lg text-[--sims-green-dark]">Funcionários da Unidade</h3><button data-action="open-modal" data-modal-type="add-employee-branch" data-id="${branch.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-xs font-bold">+ Contratar</button></div>
                    <div class="space-y-2">${employeesHTML || '<p class="text-sm italic text-[--text-secondary] text-center py-4">Nenhum funcionário na filial.</p>'}</div>
                </div>
            </div>`;
        }

        function PartyProfilePage() {
            const party = state.parties.find(p => p.id === state.currentPartyId);
            if (!party) return ErrorPage('Partido não encontrado.', 'politics');
            const president = state.residents.find(r => r.id === party.presidentId);
            const members = state.residents.filter(r => r.partyId === party.id);
            const membersHTML = members.map(mem => `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><p class="font-semibold">${mem.firstName} ${mem.lastName} ${mem.id === party.presidentId ? '<span class="text-xs font-bold text-green-500">(Presidente)</span>' : ""}</p>${mem.id !== party.presidentId ? `<button data-action="remove-member" data-resident-id="${mem.id}" class="text-red-500 hover:text-red-700 p-1 rounded-full"><i data-lucide="user-minus" class="h-4 w-4"></i></button>` : ""}</div>`).join("");
            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="navigate" data-page="politics" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Política</button>
                <div class="flex justify-between items-start">
                    <div><h1 class="text-3xl font-bold text-[--sims-green-dark]">${party.name}</h1><p class="text-[--text-secondary]">${party.spectrum}</p></div>
                    <div class="flex items-center gap-2">
                        <button data-action="open-modal" data-modal-type="edit-party" data-id="${party.id}" class="bg-[--border-color] text-[--text-primary] px-4 py-2 rounded-lg text-sm font-semibold">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-delete" data-type="party" data-id="${party.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg text-sm font-semibold"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Presidência</h3><p>${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-2"><h3 class="font-semibold text-lg">Membros (${members.length})</h3><button data-action="open-modal" data-modal-type="add-member" data-id="${party.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1"><i data-lucide="user-plus" class="h-4 w-4"></i> Filiar</button></div><div class="space-y-2">${members.length ? membersHTML : '<p class="text-center italic text-[--text-secondary] py-4">Nenhum membro filiado.</p'}</div></div>
            </div>`;
        }

        function CouncilProfilePage() {
            const council = state.councils.find(c => c.id === state.currentCouncilId);
            if (!council) return ErrorPage('Conselho não encontrado.', 'politics');
            const president = state.residents.find(r => r.id === council.presidentId);
            const councilors = (council.councilorIds || []).map(id => state.residents.find(r => r.id === id)).filter(Boolean);
            const councilorsHTML = councilors.map(mem => `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><p class="font-semibold">${mem.firstName} ${mem.lastName}</p><button data-action="open-modal" data-modal-type="remove-councilor-reason" data-resident-id="${mem.id}" data-council-id="${council.id}" class="text-red-500 hover:text-red-700 p-1 rounded-full"><i data-lucide="user-minus" class="h-4 w-4"></i></button></div>`).join("");
            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="navigate" data-page="politics" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Política</button>
                <div class="flex justify-between items-start">
                    <div><h1 class="text-3xl font-bold text-[--sims-green-dark]">${council.name}</h1><p class="text-[--text-secondary]">Conselho Municipal</p></div>
                    <div class="flex items-center gap-2">
                        <button data-action="open-modal" data-modal-type="edit-council" data-id="${council.id}" class="bg-[--border-color] text-[--text-primary] px-4 py-2 rounded-lg text-sm font-semibold">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-delete" data-type="council" data-id="${council.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg text-sm font-semibold"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Presidência</h3><p>${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-2"><h3 class="font-semibold text-lg">Conselheiros (${councilors.length})</h3><button data-action="open-modal" data-modal-type="add-councilor" data-id="${council.id}" class="bg-[--sims-green-vibrant] text-white px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1"><i data-lucide="user-plus" class="h-4 w-4"></i> Adicionar</button></div><div class="space-y-2">${councilors.length ? councilorsHTML : '<p class="text-center italic text-[--text-secondary] py-4">Nenhum conselheiro adicionado.</p>'}</div></div>
            </div>`;
        }

        function RegionProfilePage() {
            const region = state.regions.find(r => r.id === state.currentRegionId);
            if (!region) return ErrorPage('Região não encontrada.', 'regions');
            const residentsInRegion = state.residents.filter(r => !r.isDeceased && r.regionId === region.id);
            const businessesInRegion = state.businesses.filter(b => b.regionId === region.id);
            const residentsHTML = residentsInRegion.length > 0 ? residentsInRegion.map(sim => ResidentCard(sim)).join("") : '<p class="text-center italic text-[--text-secondary] py-4">Nenhum morador nesta região.</p>';
            const businessesHTML = businessesInRegion.length > 0 ? businessesInRegion.map(biz => BusinessCard(biz)).join("") : '<p class="text-center italic text-[--text-secondary] py-4">Nenhuma empresa nesta região.</p>';

            return `<div class="page-content p-4 md:p-6 space-y-6">
                <div><button data-action="navigate" data-page="regions" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Regiões</button>
                <div class="flex justify-between items-start">
                    <h1 class="text-3xl font-bold text-[--sims-green-dark]">${region.name}</h1>
                    <div class="flex items-center gap-2">
                        <button data-action="open-modal" data-modal-type="edit-region" data-id="${region.id}" class="bg-[--border-color] text-[--text-primary] px-4 py-2 rounded-lg text-sm font-semibold">Editar</button>
                        <button data-action="open-modal" data-modal-type="confirm-delete" data-type="region" data-id="${region.id}" class="bg-[--danger-bg] text-[--danger-text] p-2 rounded-lg text-sm font-semibold"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    </div>
                </div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Moradores (${residentsInRegion.length})</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${residentsHTML}</div></div>
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-semibold text-lg mb-2">Empresas (${businessesInRegion.length})</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${businessesHTML}</div></div>
            </div>`;
        }

        const HeaderComponent = (title, subtitle, version) => `<div class="flex justify-between items-center"><div class="flex items-center gap-3"><svg width="32" height="32" viewBox="0 0 100 100" class="fill-current text-[--sims-green-vibrant]"><path d="M50 0 L100 50 L50 100 L0 50 Z"></path></svg><h1 class="text-3xl md:text-4xl font-extrabold text-[--sims-green-dark]">${title}</h1></div><div class="flex items-center space-x-3"><span class="text-xs font-mono text-[--text-secondary] bg-[--border-color] px-2 py-1 rounded-md">${version}</span><button data-action="toggle-dark-mode" class="text-[--text-secondary] hover:text-[--text-primary]">${document.documentElement.classList.contains('dark') ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>'}</button></div></div><p class="text-[--text-secondary] mt-1 font-medium">${subtitle}</p>`;
        const SearchComponent = (type) => `<div class="relative mb-4"><input type="text" id="search-input" class="w-full pl-10 pr-4 py-2 border border-[--border-color] rounded-md bg-[--card-bg] text-[--text-primary] focus:ring-2 focus:ring-[--sims-green-vibrant] transition" placeholder="Buscar ${type}..." value="${state.searchQuery}"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-[--text-secondary]"></i></div>`;
        const FABComponent = (modalType) => `<button data-action="open-modal" data-modal-type="${modalType}" class="fixed bottom-24 right-6 bg-[--sims-green-vibrant] text-white p-4 rounded-full shadow-lg hover:bg-green-500 transition-transform transform hover:scale-110 z-30"><i data-lucide="plus" class="h-6 w-6"></i></button>`;
        const ErrorPage = (message, returnPage) => `<div class="p-8 text-center"><p>${message} <a href="#" data-action="navigate" data-page="${returnPage}" class="text-[--sims-green-vibrant] font-semibold hover:underline">Voltar</a>.</p></div>`;
        const createReasonRadios = (name, reasons) => `<div class="space-y-2">${reasons.map((reason, index) => `<div><input type="radio" name="${name}" value="${reason}" id="${name}-${index}" class="hidden peer" ${index === 0 ? 'checked' : ""} required><label for="${name}-${index}" class="reason-radio-label peer-checked:bg-[--sims-green-dark] peer-checked:text-white">${reason}</label></div>`).join("")}</div>`;

        function renderModal(modalType, dataId, e) {
            let title = "", contentHTML = "", formId = "", submitAction = "";
            const regionOptions = state.regions.map(r => ({ value: r.id, text: r.name }));
            regionOptions.unshift({ value: 'null', text: 'Não especificada' });
            const adultSims = state.residents.filter(r => !r.isDeceased && ['Adulto', 'Idoso'].includes(r.lifeStage)).map(s => ({ value: s.id, text: `${s.firstName} ${s.lastName}` }));

            switch (modalType) {
                case 'confirm-delete-business': {
                    const biz = state.businesses.find(b => b.id === dataId);
                    title = `Remover ${biz.name}`; formId = 'delete-business-form'; submitAction = 'process-delete-business';
                    contentHTML = `<p class="mb-4 text-[--text-secondary]">Escolha o motivo da remoção da empresa:</p>${createReasonRadios('reason', businessRemovalOptions)}<input type="hidden" name="id" value="${dataId}"><button type="submit" class="w-full mt-6 bg-[--sims-green-dark] text-white py-3 rounded-lg font-bold">Confirmar Remoção</button>`;
                } break;

                case 'confirm-delete-branch': {
                    const br = state.branches.find(b => b.id === dataId);
                    title = `Remover Filial ${br.name}`; formId = 'delete-branch-form'; submitAction = 'process-delete-branch';
                    contentHTML = `<p class="mb-4 text-[--text-secondary]">Escolha o motivo da remoção desta unidade:</p>${createReasonRadios('reason', businessRemovalOptions)}<input type="hidden" name="id" value="${dataId}"><button type="submit" class="w-full mt-6 bg-[--sims-green-dark] text-white py-3 rounded-lg font-bold">Confirmar Remoção</button>`;
                } break;

                case 'start-election-setup': {
                    title = 'Nova Eleição'; formId = 'start-election-form'; submitAction = 'start-election';
                    const ministryOptions = (state.government.ministries || []).map(m => ({ value: m.id, text: m.name }));
                    contentHTML = `
                        ${createFormSelect('type', 'Cargo em Disputa', [{ value: 'prefeito', text: 'Prefeito(a)' }, { value: 'ministro', text: 'Ministro(a)' }])}
                        <div id="ministry-select-wrapper" class="hidden">
                            ${createFormSelect('ministryId', 'Qual Ministério?', ministryOptions)}
                        </div>
                        <div class="mb-4 flex items-center gap-2">
                            <input type="checkbox" id="isTestMode" name="isTestMode" class="w-5 h-5">
                            <label for="isTestMode" class="font-semibold text-sm">Modo Teste (Não salva no histórico nem cargos)</label>
                        </div>
                        <button type="submit" class="w-full bg-[--sims-green-dark] text-white py-3 rounded-lg font-bold">Iniciar Período Eleitoral</button>
                    `;
                } break;

                case 'setup-second-round': {
                    title = 'Configurar 2º Turno'; formId = 'second-round-form'; submitAction = 'start-second-round';
                    const currentCands = state.election.candidates || [];
                    const checkboxHTML = currentCands.map(c => {
                        const s = state.residents.find(x => x.id === c.id);
                        return `<div><input type="checkbox" name="candidateIds" value="${c.id}" id="c-${c.id}" class="mr-2"><label for="c-${c.id}">${s ? `${s.firstName} ${s.lastName}` : 'Desconhecido'}</label></div>`;
                    }).join("");
                    contentHTML = `<p class="mb-2 text-sm text-[--text-secondary]">Selecione os candidatos que irão para o segundo turno:</p><div class="space-y-2 mb-4 max-h-40 overflow-y-auto border p-2 rounded">${checkboxHTML}</div><button type="submit" class="w-full bg-[--sims-green-dark] text-white py-3 rounded-lg font-bold">Iniciar 2º Turno</button>`;
                } break;

                case 'register-vote': {
