                    const updateDynamicFields = () => {
                        if (sectorSelect.value === 'Educação') {
                            dynamicFieldsContainer.innerHTML = createFormSelect('institutionType', 'Tipo de Instituição', institutionTypes.map(v => ({ value: v, text: v })), businessToEdit?.institutionType);
                        } else {
                            dynamicFieldsContainer.innerHTML = "";
                        }
                    };
                    sectorSelect.addEventListener('change', updateDynamicFields);
                    updateDynamicFields();
                }

                if (modalType === 'add-job') {
                    const bizSelect = document.getElementById('businessId');
                    const updateLocals = () => {
                        const branches = state.branches.filter(b => b.parentBusinessId === bizSelect.value);
                        const opts = [{ value: 'null', text: 'Sede' }].concat(branches.map(b => ({ value: b.id, text: `Filial: ${b.name}` })));
                        document.getElementById('local-select-container').innerHTML = createFormSelect('branchId', 'Local de Trabalho', opts);
                    };
                    bizSelect.addEventListener('change', updateLocals);
                    updateLocals();
                }
                lucide.createIcons();
            }, 10);
        }

        function closeModal() {
            const b = document.getElementById('modal-backdrop'), c = document.getElementById('modal-content');
            if (b && c) {
                b.classList.add('opacity-0');
                c.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => { document.getElementById('modal-container').innerHTML = ""; }, 300);
            }
        }

        const createFormInput = (id, label, value = "") => `<div class="mb-4"><label for="${id}" class="block text-sm font-medium mb-1 text-[--text-secondary]">${label}</label><input type="text" id="${id}" name="${id}" value="${value}" required class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color] text-[--text-primary] focus:ring-[--sims-green-vibrant] focus:border-[--sims-green-vibrant]"></div>`;
        const createFormSelect = (id, label, options, selectedValue = "") => `<div class="mb-4"><label for="${id}" class="block text-sm font-medium mb-1 text-[--text-secondary]">${label}</label><select id="${id}" name="${id}" required class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color] text-[--text-primary] focus:ring-[--sims-green-vibrant] focus:border-[--sims-green-vibrant]">${options.map(opt => `<option value="${opt.value}" ${String(opt.value) === String(selectedValue) ? 'selected' : ""}>${opt.text}</option>`).join("")}</select></div>`;

        function normalizeEmployment(employmentData) {
            if (!employmentData) return [];
            if (Array.isArray(employmentData)) return employmentData;
            if (typeof employmentData === 'object' && employmentData !== null) return [employmentData];
            return [];
        }

        async function handleFormSubmit(form) {
            const { action, id } = form.dataset;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            const regionId = data.regionId === 'null' ? null : data.regionId;

            try {
                switch (action) {
                    case 'process-delete-business': await handleBusinessRemoval(data.id, data.reason); break;
                    case 'process-delete-branch': await handleBranchRemoval(data.id, data.reason); break;
                    case 'process-vote': await processVote(data.voterId, data.candidateId); break;
                    case 'start-election': await startElection(data); break;
                    case 'start-second-round': await startSecondRound(formData.getAll('candidateIds')); break;
                    case 'save-sectors': 
                        await setDoc(doc(db, "config", "sectors"), { list: Array.from(formData.getAll('sectorName')) }); 
                        break;
                    case 'process-removal': await handleProcessRemoval(data.residentId, data.reason); break;
                    case 'add-resident': await addDoc(collection(db, "residents"), { ...data, regionId, employment: [], education: [], history: [], relationships: [], councilRoles: [], partyId: null, governmentRole: null, isDeceased: false, createdAt: serverTimestamp() }); break;
                    case 'edit-resident': await updateDoc(doc(db, "residents", id), { ...data, regionId }); break;
                    case 'delete-resident': await handleDeleteResident(id); if (state.currentPage !== 'settings') state.currentPage = 'dashboard'; break;
                    case 'add-relationship': await handleAddRelationship(id, data.relatedSimId, data.relationshipType); break;
                    case 'add-business': await handleAddBusiness(data); break;
                    case 'edit-business': await handleEditBusiness(id, data); break;
                    case 'add-branch': await addDoc(collection(db, "branches"), { ...data, regionId: data.regionId === 'null' ? null : data.regionId, managerId: data.managerId === 'null' ? null : data.managerId, createdAt: serverTimestamp() }); break;
                    case 'edit-branch': await updateDoc(doc(db, "branches", id), { ...data, regionId: data.regionId === 'null' ? null : data.regionId, managerId: data.managerId === 'null' ? null : data.managerId }); break;
                    case 'add-job': await handleHire(data.businessId, data.branchId === 'null' ? null : data.branchId, data.residentId, data.position); break;
                    case 'add-employee': await handleHire(id, null, data.residentId, data.position); break;
                    case 'add-employee-branch': {
                        const br = state.branches.find(b => b.id === data.id);
                        await handleHire(br.parentBusinessId, data.id, data.residentId, data.position);
                    } break;
                    case 'remove-employee-with-reason': await handleRemoveEmployee(data.residentId, data.businessId, data.reason); break;
                    case 'remove-minister-with-reason': await handleRemoveMinister(data.residentId, data.officeId, data.officeName, data.reason); break;
                    case 'process-remove-councilor': await handleRemoveCouncilorWithReason(data.residentId, data.councilId, data.reason); break;
                    case 'add-party': await handleAddParty(data); break;
                    case 'edit-party': await handleEditParty(id, data); break;
                    case 'delete-party': await handleDeleteParty(id); if (state.currentPage !== 'settings') state.currentPage = 'politics'; break;
                    case 'add-council': await handleAddCouncil(data); break;
                    case 'edit-council': await handleEditCouncil(id, data); break;
                    case 'delete-council': await handleDeleteCouncil(id); state.currentPage = 'politics'; break;
                    case 'add-councilor': await handleAddCouncilor(id, data.residentId); break;
                    case 'add-region': await addDoc(collection(db, "regions"), { name: data.name, createdAt: serverTimestamp() }); break;
                    case 'edit-region': await updateDoc(doc(db, "regions", id), { name: data.name }); break;
                    case 'delete-region': await handleDeleteRegion(id); state.currentPage = 'regions'; break;
                    case 'manage-ministries': await setDoc(doc(db, "government", "config"), { ministries: Array.from(formData.getAll('ministryName')).map(name => ({ id: name.toLowerCase().replace(/\s+/g, '-'), name })) }); break;
                    case 'appoint-minister': await handleAppointMinister(data.officeId, data.officeName, data.residentId); break;
                    case 'add-member': await updateDoc(doc(db, "residents", data.residentId), { partyId: id }); break;
                    case 'add-candidate': await updateDoc(doc(db, "election", "current"), { candidates: [...(state.election.candidates || []), { id: data.residentId }] }); break;
                    case 'declare-winner': await finalizeElection(data.residentId); break;
                    case 'manage-courses': await updateDoc(doc(db, "businesses", id), { courses: Array.from(formData.getAll('courseName')) }); break;
                    case 'add-student': await handleAddStudent(id, data.residentId, data.course, data.status); break;
                    case 'add-law': await addDoc(collection(db, "laws"), { title: data.title, description: data.description, authorIds: formData.getAll('authorIds'), proclaimedById: data.proclaimedById, createdAt: serverTimestamp() }); break;
                    case 'process-remove-law': await handleRemoveLaw(data.lawId, data.reason); break;
                }
                closeModal();
            } catch (error) {
                console.error("Erro no Firebase:", error);
                alert("Ocorreu um erro ao salvar.");
            }
        }

        async function handleBusinessRemoval(bizId, reason) {
            const biz = state.businesses.find(b => b.id === bizId);
            if (!biz) return;
            if (reason !== 'Apenas Remoção') {
                await addDoc(collection(db, "closedRecords"), { name: biz.name, sector: biz.sector, type: 'Empresa', reason: reason, date: serverTimestamp() });
            }
            await handleDeleteBusiness(bizId);
            state.currentPage = 'businesses';
            render();
        }

        async function handleBranchRemoval(brId, reason) {
            const br = state.branches.find(b => b.id === brId);
            if (!br) return;
            const sede = state.businesses.find(b => b.id === br.parentBusinessId);
            if (reason !== 'Apenas Remoção') {
                await addDoc(collection(db, "closedRecords"), { name: br.name, sector: `Unidade de ${sede?.name}`, type: 'Filial', reason: reason, date: serverTimestamp() });
            }
            await deleteDoc(doc(db, "branches", brId));
            state.currentPage = 'businesses';
            render();
        }

        async function handleRemoveLaw(lawId, reason) {
            const law = state.laws.find(l => l.id === lawId);
            if (!law) return;
            if (reason !== 'Apenas Remoção') {
                await addDoc(collection(db, "closedRecords"), { name: law.title, sector: 'Legislativo', type: 'Lei', reason: reason, description: law.description, date: serverTimestamp() });
            }
            await deleteDoc(doc(db, "laws", lawId));
            render();
        }

        async function startElection(data) {
            const minName = data.type === 'ministro' ? (state.government.ministries.find(m => m.id === data.ministryId)?.name || 'Ministério') : null;
            await setDoc(doc(db, "election", "current"), {
                isActive: true,
                type: data.type,
                ministryId: data.ministryId || null,
                ministryName: minName,
                isTestMode: !!data.isTestMode,
                candidates: [],
                votes: [],
                round: 1
            });
        }

        async function startSecondRound(candidateIds) {
            // Filter candidates
            const selectedCandidates = (state.election.candidates || []).filter(c => candidateIds.includes(c.id));
            await updateDoc(doc(db, "election", "current"), {
                round: 2,
                votes: [], // Reset votes for 2nd round
                candidates: selectedCandidates
            });
        }

        async function processVote(voterId, candidateId) {
            const currentVotes = state.election.votes || [];
            const newVotes = [...currentVotes, { voterId, candidateId }];
            await updateDoc(doc(db, "election", "current"), { votes: newVotes });
        }

        async function finalizeElection(winnerId) {
            const { type, ministryId, ministryName, isTestMode, votes, candidates, round } = state.election;
            
            if (!isTestMode) {
                const voteCount = (votes || []).reduce((acc, v) => {
                    acc[v.candidateId] = (acc[v.candidateId] || 0) + 1;
                    return acc;
                }, {});

                await addDoc(collection(db, "electionHistory"), {
                    type,
                    ministryId,
                    ministryName,
                    winnerId,
                    winnerVotes: voteCount[winnerId] || 0,
                    totalVotes: (votes || []).length,
                    votes: (votes || []),
                    candidates: (candidates || []),
                    date: serverTimestamp(),
                    round: round || 1
                });

                if (type === 'prefeito') {
                    await handleAppointMinister('prefeito', 'Prefeito(a)', winnerId);
                } else {
                    await handleAppointMinister(ministryId, ministryName, winnerId);
                }
            }
            await setDoc(doc(db, "election", "current"), { isActive: false });
        }

        function generateElectionReport() {
            const { votes, candidates, type, ministryName, round } = state.election;
            const typeLabel = type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${ministryName})`;
            const roundLabel = round === 2 ? '2º Turno' : '1º Turno';
            const curVotes = votes || [];
            
            let out = `### RELATÓRIO PARCIAL DE ELEIÇÃO: ${typeLabel} - ${roundLabel}\n\n`;
            
            const results = (candidates || []).map(c => {
                const sim = state.residents.find(x => x.id === c.id);
                const party = state.parties.find(p => p.id === sim?.partyId);
                const myVotes = curVotes.filter(v => v.candidateId === c.id);
                const votersNames = myVotes.map(v => {
                    const vs = state.residents.find(x => x.id === v.voterId);
                    return vs ? `${vs.firstName} ${vs.lastName}` : 'Anônimo';
                });

                return {
                    name: sim ? `${sim.firstName} ${sim.lastName}` : 'Desconhecido',
                    party: party ? party.name : 'Sem Partido',
                    count: myVotes.length,
                    voters: votersNames
                };
            }).sort((a,b) => b.count - a.count);

            results.forEach(res => {
                out += `CANDIDATO: ${res.name} (${res.party})\nVOTOS: ${res.count}\nVOTANTES: ${res.voters.join(", ") || 'Nenhum'}\n\n`;
            });

            if (results.length > 0) out += `VENCEDOR ATUAL: ${results[0].name}\n`;
            else out += `NENHUM CANDIDATO REGISTRADO.\n`;

            state.currentPage = 'register';
            render();
            
            const textarea = document.getElementById('report-textarea');
            const output = document.getElementById('report-output');
            if (textarea && output) {
                textarea.value = out;
                output.classList.remove('hidden');
            }
        }

        async function handleProcessRemoval(resId, reason) {
            if (reason === 'Morreu') {
                await updateDoc(doc(db, "residents", resId), { isDeceased: true, deathDate: new Date(), employment: [] });
            } else {
                await deleteDoc(doc(db, "residents", resId));
                state.residents.forEach(async r => {
                    if (r.relationships?.some(rel => rel.residentId === resId)) {
                        const newRels = r.relationships.filter(rel => rel.residentId !== resId);
                        await updateDoc(doc(db, "residents", r.id), { relationships: newRels });
                    }
                });
            }
            state.currentPage = 'dashboard';
            render();
        }

        async function handleHire(bizId, brId, resId, pos) {
            const resRef = doc(db, "residents", resId);
            const resDoc = await getDoc(resRef);
            const currentJobs = normalizeEmployment(resDoc.data()?.employment);
            currentJobs.push({ businessId: bizId, branchId: brId, position: pos });
            await updateDoc(resRef, { employment: currentJobs });
        }

        async function handleRemoveEmployee(residentId, businessId, reason) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data();
            if (!resident) return;
            const newEmployment = normalizeEmployment(resident.employment).filter(job => job.businessId !== businessId);
            const updates = { employment: newEmployment };
            if (reason !== 'Apenas remoção') {
                const business = state.businesses.find(b => b.id === businessId);
                const historyEntry = { id: crypto.randomUUID(), type: 'job', status: reason, location: business ? business.name : 'Empresa Desconhecida', date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            await updateDoc(residentRef, updates);
        }

        async function handleRemoveMinister(residentId, officeId, officeName, reason) {
            const batch = writeBatch(db);
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data();
            if (!resident) return;
            const newRoles = { ...state.government.roles };
            delete newRoles[officeId];
            batch.set(doc(db, "government", "roles"), newRoles);
            const updates = { governmentRole: null };
            if (reason !== 'Apenas remoção') {
                const historyEntry = { id: crypto.randomUUID(), type: 'government', status: reason, location: officeName, date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            batch.update(residentRef, updates);
            await batch.commit();
        }

        async function handleDeleteHistoryEntry(residentId, historyId) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data();
            if (!resident || !resident.history) return;
            const newHistory = resident.history.filter(entry => entry.id !== historyId);
            await updateDoc(residentRef, { history: newHistory });
        }

        async function handleDeleteResident(id) {
            const batch = writeBatch(db);
            batch.delete(doc(db, "residents", id));
            state.residents.forEach(r => {
                if (r.id !== id && r.relationships?.some(rel => rel.residentId === id)) {
                    const newRelationships = r.relationships.filter(rel => rel.residentId !== id);
                    batch.update(doc(db, "residents", r.id), { relationships: newRelationships });
                }
            });
            const ownedBusiness = state.businesses.find(b => b.ownerId === id);
            if (ownedBusiness) batch.update(doc(db, "businesses", ownedBusiness.id), { ownerId: null });
            const partyPresident = state.parties.find(p => p.id === id);
            if (partyPresident) batch.update(doc(db, "parties", partyPresident.id), { presidentId: null });
            Object.entries(state.government.roles || {}).forEach(([roleId, holderId]) => {
                if (holderId === id) {
                    const newRoles = { ...state.government.roles };
                    delete newRoles[roleId];
                    batch.set(doc(db, "government", "roles"), newRoles);
                }
            });
            state.councils.forEach(c => {
                if (c.presidentId === id) batch.update(doc(db, "councils", c.id), { presidentId: null });
                if (c.councilorIds?.includes(id)) {
                    const newCouncilors = c.councilorIds.filter(cid => cid !== id);
                    batch.update(doc(db, "councils", c.id), { councilorIds: newCouncilors });
                }
            });
            await batch.commit();
        }

        async function handleDeleteRegion(id) {
            const batch = writeBatch(db);
            batch.delete(doc(db, "regions", id));
            state.residents.forEach(r => { if (r.regionId === id) batch.update(doc(db, "residents", r.id), { regionId: null }); });
            state.businesses.forEach(b => { if (b.regionId === id) batch.update(doc(db, "businesses", b.id), { regionId: null }); });
            await batch.commit();
        }

        async function updateResidentCouncilRoles(batch, residentId, councilId, councilName, newRole) {
            if (!residentId) return;
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const resident = resDoc.data();
            if (!resident) return;
            let councilRoles = resident.councilRoles || [];
            councilRoles = councilRoles.filter(r => r.councilId !== councilId);
            if (newRole) councilRoles.push({ councilId, councilName, role: newRole });
            batch.update(residentRef, { councilRoles });
        }

        async function handleAddCouncil(data) {
            const presidentId = data.presidentId === 'null' ? null : data.presidentId;
            const batch = writeBatch(db);
            const newCouncilRef = doc(collection(db, "councils"));
            batch.set(newCouncilRef, { name: data.name, presidentId, councilorIds: [], createdAt: serverTimestamp() });
            if (presidentId) await updateResidentCouncilRoles(batch, presidentId, newCouncilRef.id, data.name, 'Presidente');
            await batch.commit();
        }

        async function handleEditCouncil(id, data) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", id);
            const oldCouncil = state.councils.find(c => c.id === id);
            const newPresidentId = data.presidentId === 'null' ? null : data.presidentId;
            batch.update(councilRef, { name: data.name, presidentId: newPresidentId });
            if (oldCouncil.presidentId !== newPresidentId) {
                if (oldCouncil.presidentId) await updateResidentCouncilRoles(batch, oldCouncil.presidentId, id, oldCouncil.name, null);
                if (newPresidentId) await updateResidentCouncilRoles(batch, newPresidentId, id, data.name, 'Presidente');
            }
            await batch.commit();
        }

        async function handleDeleteCouncil(id) {
            const batch = writeBatch(db);
            const councilToDelete = state.councils.find(c => c.id === id);
            if (!councilToDelete) return;
            batch.delete(doc(db, "councils", id));
            const memberIds = [councilToDelete.presidentId, ...(councilToDelete.councilorIds || [])].filter(Boolean);
            for (const memberId of memberIds) await updateResidentCouncilRoles(batch, memberId, id, councilToDelete.name, null);
            await batch.commit();
        }

        async function handleAddCouncilor(councilId, residentId) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", councilId);
            const council = state.councils.find(c => c.id === councilId);
            if (!council || !residentId) return;
            const councilorIds = [...(council.councilorIds || []), residentId];
            batch.update(councilRef, { councilorIds });
            await updateResidentCouncilRoles(batch, residentId, councilId, council.name, 'Conselheiro(a)');
            await batch.commit();
        }

        async function handleRemoveCouncilorWithReason(residentId, councilId, reason) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", councilId);
            const council = state.councils.find(c => c.id === councilId);
            if (!council) return;
            
            // Remove from council list
            const newCouncilorIds = (council.councilorIds || []).filter(id => id !== residentId);
            batch.update(councilRef, { councilorIds: newCouncilorIds });
            
            // Remove role from resident
            await updateResidentCouncilRoles(batch, residentId, councilId, council.name, null);
            
            // Log history if needed
             if (reason !== 'Apenas remoção') {
                const residentRef = doc(db, "residents", residentId);
                const resDoc = await getDoc(residentRef);
                const resident = resDoc.data();
                if (resident) {
                     const historyEntry = { id: crypto.randomUUID(), type: 'politics', status: reason, location: `Conselho: ${council.name}`, date: new Date() };
                     batch.update(residentRef, { history: [...(resident.history || []), historyEntry] });
                }
            }
            
            await batch.commit();
        }

        async function handleAddStudent(businessId, residentId, course, status) {
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const newEducation = { businessId, course, status };
            const updated = (resDoc.data().education || []).filter(edu => edu.businessId !== businessId);
            updated.push(newEducation);
            await updateDoc(residentRef, { education: updated });
        }

        async function handleAddRelationship(simAId, simBId, type) {
            const resA = state.residents.find(s => s.id === simAId);
            await updateDoc(doc(db, "residents", simAId), { 
                relationships: [...(resA.relationships || []), { residentId: simBId, type: type }] 
            });
        }

        async function handleDeleteRelationship(residentId, index) {
            const sim = state.residents.find(r => r.id === residentId);
            if (!sim) return;
            const newRels = [...(sim.relationships || [])];
            newRels.splice(index, 1);
            await updateDoc(doc(db, "residents", residentId), { relationships: newRels });
        }

        async function handleAddBusiness(data) {
            const ownerId = data.ownerId === 'null' ? null : data.ownerId;
            const regionId = data.regionId === 'null' ? null : data.regionId;
            const bizData = { name: data.name, sector: data.sector, ownerId, regionId, createdAt: serverTimestamp(), ...(data.sector === 'Educação' && { institutionType: data.institutionType, courses: [] }) };
            const newBizRef = await addDoc(collection(db, "businesses"), bizData);
            if (ownerId) await handleHire(newBizRef.id, null, ownerId, 'Proprietário(a)');
        }

        async function handleEditBusiness(id, data) {
            const oldBiz = state.businesses.find(b => b.id === id);
            const newOwnerId = data.ownerId === 'null' ? null : data.ownerId;
            const newRegionId = data.regionId === 'null' ? null : data.regionId;
            const batch = writeBatch(db);
            batch.update(doc(db, "businesses", id), { name: data.name, sector: data.sector, ownerId: newOwnerId, regionId: newRegionId, ...(data.sector === 'Educação' && { institutionType: data.institutionType }) });
            if (oldBiz.ownerId !== newOwnerId) {
                if (oldBiz.ownerId) {
                    const oldOwner = state.residents.find(r => r.id === oldBiz.ownerId);
                    if (oldOwner) {
                        const newEmp = normalizeEmployment(oldOwner.employment).filter(j => !(j.businessId === id && j.position === 'Proprietário(a)'));
                        batch.update(doc(db, "residents", oldBiz.ownerId), { employment: newEmp });
                    }
                }
                if (newOwnerId) {
                    const newOwner = state.residents.find(r => r.id === newOwnerId);
                    if (newOwner) {
                        const newEmp = [...normalizeEmployment(newOwner.employment), { businessId: id, position: 'Proprietário(a)' }];
                        batch.update(doc(db, "residents", newOwnerId), { employment: newEmp });
                    }
                }
            }
            await batch.commit();
        }

        async function handleDeleteBusiness(id) {
            const batch = writeBatch(db);
            batch.delete(doc(db, "businesses", id));
            state.residents.forEach(r => {
                if (r.employment?.some(j => j.businessId === id)) batch.update(doc(db, "residents", r.id), { employment: r.employment.filter(j => j.businessId !== id) });
                if (r.education?.some(e => e.businessId === id)) batch.update(doc(db, "residents", r.id), { education: r.education.filter(e => e.businessId !== id) });
            });
            await batch.commit();
        }

        function generateReport(type) {
            let out = `### REGISTRO DETALHADO SIM - ${new Date().toLocaleString('pt-BR')}\n==========================\n\n`;
            if (type === 'residents') {
                state.residents.filter(r => !r.isDeceased).forEach(r => {
                    out += `NOME: ${r.firstName} ${r.lastName}\nFASE: ${r.lifeStage} | GÊNERO: ${r.gender}\n`;
                    out += `REGIÃO: ${state.regions.find(reg => reg.id === r.regionId)?.name || 'S/R'}\nOCUPAÇÕES:\n`;
                    if (r.employment?.length) {
                        r.employment.forEach(j => {
                            const b = state.businesses.find(x => x.id === j.businessId);
                            const br = state.branches.find(x => x.id === j.branchId);
                            out += `- ${j.position} em ${b?.name || '?'}${br ? ` (Unidade ${br.name})` : ' (Sede)'}\n`;
                        });
                    } else out += ` - Desempregado(a)\n`;
                    out += `RELAÇÕES:\n`;
                    r.relationships?.forEach(rel => {
                        const p = state.residents.find(x => x.id === rel.residentId);
                        out += `- ${rel.type}: ${p ? p.firstName + ' ' + p.lastName : '?'}${p?.isDeceased ? ' [+ FALECIDO]' : ''}\n`;
                    });
                    out += `--------------------------\n\n`;
                });
            } else if (type === 'businesses') {
                state.businesses.forEach(b => {
                    const owner = state.residents.find(r => r.id === b.ownerId);
                    out += `EMPRESA: ${b.name}\nSETOR: ${b.sector}\nDONO (A): ${owner ? owner.firstName + ' ' + owner.lastName : 'PÚBLICA'}\nUNIDADES:\n`;
                    const brs = state.branches.filter(br => br.parentBusinessId === b.id);
                    if (brs.length) brs.forEach(br => out += ` - ${br.name}\n`);
                    else out += ` - Sede Única\n`;
                    out += `FUNCIONÁRIOS:\n`;
                    const emps = state.residents.filter(r => !r.isDeceased && r.employment?.some(j => j.businessId === b.id));
                    emps.forEach(e => out += `- ${e.firstName} ${e.lastName} (${e.employment.find(j => j.businessId === b.id).position})\n`);
                    out += `--------------------------\n\n`;
                });

                if (state.closedRecords.length > 0) {
                    out += `\n\nHISTÓRICO DE EMPRESAS/LEIS EXTINTAS (FALÊNCIA / ENCERRAMENTO)\n==========================\n`;
                    state.closedRecords.sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)).forEach(rec => {
                        out += `NOME: ${rec.name}\nSETOR: ${rec.sector}\nTIPO: ${rec.type}\nMOTIVO: ${rec.reason}\nDESCRIÇÃO: ${rec.description || 'N/A'}\nDATA: ${new Date(rec.date?.seconds * 1000).toLocaleString('pt-BR')}\n--------------------------\n`;
                    });
                }
            } else if (type === 'politics') {
                out += `CENÁRIO POLÍTICO COMPLETO\n\n--- PODER EXECUTIVO ---\n`;
                const ministries = [...defaultMinistries, ...(state.government.ministries || [])];
                ministries.forEach(m => {
                    const holderId = state.government.roles?.[m.id];
                    const holder = state.residents.find(r => r.id === holderId);
                    out += `${m.name}: ${holder ? `${holder.firstName} ${holder.lastName}` : 'CARGO VAGO'}\n`;
                });

                out += `\n--- PARTIDOS POLÍTICOS ---\n`;
                state.parties.forEach(p => {
                    const president = state.residents.find(r => r.id === p.presidentId);
                    const members = state.residents.filter(r => r.partyId === p.id);
                    out += `PARTIDO: ${p.name} (${p.spectrum})\nPRESIDENTE: ${president ? `${president.firstName} ${president.lastName}` : 'N/A'}\nMEMBROS (${members.length}): ${members.map(m => `${m.firstName} ${m.lastName}`).join(", ") || 'Nenhum'}\n\n`;
                });

                out += `\n--- CONSELHOS ---\n`;
                state.councils.forEach(c => {
                    const president = state.residents.find(r => r.id === c.presidentId);
                    const members = (c.councilorIds || []).map(id => state.residents.find(r => r.id === id)).filter(Boolean);
                    out += `CONSELHO: ${c.name}\nPRESIDENTE: ${president ? `${president.firstName} ${president.lastName}` : 'N/A'}\nMEMBROS: ${members.map(m => `${m.firstName} ${m.lastName}`).join(", ") || 'Nenhum'}\n\n`;
                });

                out += `\n--- LEIS MUNICIPAIS ---\n`;
                state.laws.forEach(l => {
                    const dec = state.residents.find(r => r.id === l.proclaimedById);
                    out += `LEI: ${l.title}\nDESCRIÇÃO: ${l.description}\nDECRETADO POR: ${dec ? `${dec.firstName} ${dec.lastName}` : 'N/A'}\n\n`;
                });
            } else if (type === 'obituary') {
                const dead = state.residents.filter(r => r.isDeceased);
                dead.forEach(r => out += `+ ${r.firstName} ${r.lastName}\nFaleceu em: ${new Date(r.deathDate?.seconds * 1000).toLocaleDateString('pt-BR')}\nFase em vida: ${r.lifeStage}\n--------------------------\n\n`);
            }
            document.getElementById('report-textarea').value = out;
            document.getElementById('report-output').classList.remove('hidden');
        }

        async function handleAddParty(data) {
            const presidentId = data.presidentId === 'null' ? null : data.presidentId;
            const newPartyRef = await addDoc(collection(db, "parties"), { name: data.name, spectrum: data.spectrum, presidentId, createdAt: serverTimestamp() });
            if (presidentId) await updateDoc(doc(db, "residents", presidentId), { partyId: newPartyRef.id });
        }

        async function handleEditParty(id, data) {
            const oldParty = state.parties.find(p => p.id === id);
            const newPresidentId = data.presidentId === 'null' ? null : data.presidentId;
            await updateDoc(doc(db, "parties", id), { name: data.name, spectrum: data.spectrum, presidentId: newPresidentId });
            if (oldParty.presidentId !== newPresidentId) {
                if (oldParty.presidentId) await updateDoc(doc(db, "residents", oldParty.presidentId), { partyId: null });
                if (newPresidentId) await updateDoc(doc(db, "residents", newPresidentId), { partyId: id });
            }
        }

        async function handleAppointMinister(officeId, officeName, newHolderId) {
            const batch = writeBatch(db);
            const currentHolderId = state.government.roles?.[officeId];
            newHolderId = newHolderId === 'null' ? null : newHolderId;
            if (currentHolderId && currentHolderId !== newHolderId) batch.update(doc(db, "residents", currentHolderId), { governmentRole: null });
            if (newHolderId) batch.update(doc(db, "residents", newHolderId), { governmentRole: officeName });
            const newRoles = { ...state.government.roles, [officeId]: newHolderId };
            if (!newHolderId) delete newRoles[officeId];
            batch.set(doc(db, "government", "roles"), newRoles);
            await batch.commit();
        }

        function destroyCharts() { Object.values(state.charts).forEach(chart => chart.destroy()); state.charts = {}; }

        function renderCharts() {
            const isDarkMode = document.documentElement.classList.contains('dark');
            const textColor = isDarkMode ? 'rgba(229, 231, 235, 0.8)' : 'rgba(5, 46, 46, 0.8)';
            const gridColor = isDarkMode ? 'rgba(74, 110, 110, 0.3)' : 'rgba(229, 231, 235, 1)';
            const chartColors = ['#4ade80', '#34d399', '#2dd4bf', '#22d3ee', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#c084fc', '#e879f9'];

            const ctxAge = document.getElementById('age-chart')?.getContext('2d');
            if (ctxAge) state.charts.age = new Chart(ctxAge, { type: 'bar', data: { labels: lifeStages, datasets: [{ label: 'Moradores', data: lifeStages.map(s => state.residents.filter(r => !r.isDeceased && r.lifeStage === s).length), backgroundColor: chartColors }] }, options: { scales: { y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { color: gridColor } } }, plugins: { legend: { display: false } } } });

            const genderCtx = document.getElementById('gender-chart')?.getContext('2d');
            if (genderCtx) {
                const gCounts = state.residents.filter(r => !r.isDeceased).reduce((acc, r) => { acc[r.gender || 'Não definido'] = (acc[r.gender || 'Não definido'] || 0) + 1; return acc; }, {});
                state.charts.gender = new Chart(genderCtx, { type: 'pie', data: { labels: Object.keys(gCounts), datasets: [{ data: Object.values(gCounts), backgroundColor: chartColors }] }, options: { plugins: { legend: { labels: { color: textColor } } } } });
            }

            const ethnicityCtx = document.getElementById('ethnicity-chart')?.getContext('2d');
            if (ethnicityCtx) {
                const eCounts = state.residents.filter(r => !r.isDeceased).reduce((acc, r) => { acc[r.ethnicity || 'Não definida'] = (acc[r.ethnicity || 'Não definida'] || 0) + 1; return acc; }, {});
                state.charts.ethnicity = new Chart(ethnicityCtx, { type: 'pie', data: { labels: Object.keys(eCounts), datasets: [{ data: Object.values(eCounts), backgroundColor: chartColors }] }, options: { plugins: { legend: { labels: { color: textColor } } } } });
            }

            const regionCtx = document.getElementById('region-chart')?.getContext('2d');
            if (regionCtx) {
                const rCounts = state.regions.map(region => ({ name: region.name, count: state.residents.filter(r => !r.isDeceased && r.regionId === region.id).length }));
                state.charts.region = new Chart(regionCtx, { type: 'bar', data: { labels: rCounts.map(r => r.name), datasets: [{ label: 'Moradores', data: rCounts.map(r => r.count), backgroundColor: chartColors }] }, options: { scales: { y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { color: gridColor } } }, plugins: { legend: { display: false } } } });
            }

            const sectorCtx = document.getElementById('business-sector-chart')?.getContext('2d');
            if (sectorCtx) {
                const sCounts = state.businesses.reduce((acc, b) => { acc[b.sector] = (acc[b.sector] || 0) + 1; return acc; }, {});
                state.charts.business = new Chart(sectorCtx, { type: 'bar', data: { labels: Object.keys(sCounts), datasets: [{ label: 'Empresas', data: Object.values(sCounts), backgroundColor: chartColors }] }, options: { indexAxis: 'y', scales: { y: { ticks: { color: textColor } }, x: { ticks: { color: textColor } } }, plugins: { legend: { display: false } } } });
            }
        }

        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]'); if (!target) return;
            const { action, page, id, modalType, type, tab, relIndex } = target.dataset;

            switch (action) {
                case 'navigate': state.currentPage = page; state.searchQuery = ""; render(); break;
                case 'view-profile':
                    state.currentPage = `${type}-profile`;
                    if (type === 'resident') state.currentResidentId = id;
                    else if (type === 'business') { state.currentBusinessId = id; state.activeStudentTab = 'ativos'; }
                    else if (type === 'party') state.currentPartyId = id;
                    else if (type === 'council') state.currentCouncilId = id;
                    else if (type === 'region') state.currentRegionId = id;
                    else if (type === 'branch') state.currentBranchId = id;
                    state.searchQuery = ""; render(); break;
                case 'open-modal': renderModal(modalType, id, e); break;
                case 'close-modal': closeModal(); break;
                case 'delete-history-entry': handleDeleteHistoryEntry(target.dataset.residentId, target.dataset.historyId); break;
                case 'toggle-dark-mode':
                    document.documentElement.classList.toggle('dark');
                    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); render(); break;
                case 'delete-relationship': handleDeleteRelationship(target.dataset.simAId, parseInt(relIndex)); break;
                case 'delete-election-history': deleteDoc(doc(db, "electionHistory", id)); break;
                case 'generate-election-report': generateElectionReport(); break;
                case 'add-sector-field': {
                    const div = document.createElement('div');
                    div.className = 'flex gap-2';
                    div.innerHTML = '<input type="text" name="sectorName" class="w-full p-2 border rounded-md" required><button type="button" data-action="remove-sector-field" class="text-red-500"><i data-lucide="x"></i></button>';
                    document.getElementById('sector-list').appendChild(div);
                    lucide.createIcons();
                } break;
                case 'remove-sector-field': target.closest('.flex').remove(); break;
                case 'remove-student': (async () => {
                    const residentRef = doc(db, "residents", target.dataset.residentId);
                    const resDoc = await getDoc(residentRef);
                    const current = resDoc.data().education || [];
                    await updateDoc(residentRef, { education: current.filter(e => e.businessId !== target.dataset.businessId) });
                })(); break;
                case 'end-election': setDoc(doc(db, "election", "current"), { isActive: false }); break;
                case 'remove-member': updateDoc(doc(db, "residents", target.dataset.residentId), { partyId: null }); break;
                case 'set-student-tab': state.activeStudentTab = tab; render(); break;
                case 'generate-report': generateReport(target.dataset.reportType); break;
                case 'copy-report':
                    const textarea = document.getElementById('report-textarea');
                    textarea.select(); document.execCommand('copy');
                    target.innerHTML = '<i data-lucide="check" class="h-5 w-5"></i> Copiado!';
                    setTimeout(() => { target.innerHTML = '<i data-lucide="copy" class="h-5 w-5"></i> Copiar Texto'; lucide.createIcons(); }, 2000);
                    break;
                case 'add-ministry-field': case 'add-course-field':
                    const list = document.getElementById(action === 'add-ministry-field' ? 'ministry-list' : 'course-list');
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-2';
                    div.innerHTML = `<input type="text" name="${action === 'add-ministry-field' ? 'ministryName' : 'courseName'}" class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color]" required><button type="button" data-action="${action === 'add-ministry-field' ? 'remove-ministry-field' : 'remove-course-field'}" class="text-red-500 p-2 rounded-full hover:bg-[--danger-bg]"><i data-lucide="x"></i></button>`;
                    list.appendChild(div); lucide.createIcons(); break;
                case 'remove-ministry-field': case 'remove-course-field':
                    target.closest('.flex').remove(); break;
            }
        });

        document.addEventListener('submit', (e) => { e.preventDefault(); const form = e.target.closest('form'); if (form) handleFormSubmit(form); });
        document.addEventListener('input', (e) => { if (e.target.id === 'search-input') { state.searchQuery = e.target.value; updateListPage(); } });

        function checkAllDataLoaded() {
            const allLoaded = Object.values(state.dataLoaded).every(Boolean);
            if (allLoaded) {
                document.getElementById('loading-overlay').classList.add('opacity-0');
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none' }, 500);
                if (!state.initialRenderDone) { render(); state.initialRenderDone = true; }
            }
        }

        function updateActiveNav() {
            const page = state.currentPage;
            const isDashboard = page === 'dashboard' || page === 'resident-profile';
            const isBusinesses = page === 'businesses' || page === 'business-profile' || page === 'branch-profile';
            const isMore = ['more', 'politics', 'party-profile', 'council-profile', 'register', 'settings', 'regions', 'region-profile', 'census-data'].includes(page);

            document.querySelectorAll('.nav-button').forEach(btn => {
                const pageName = btn.dataset.page;
                let isActive = false;
                if (pageName === 'dashboard') isActive = isDashboard;
                else if (pageName === 'businesses') isActive = isBusinesses;
                else if (pageName === 'more') isActive = isMore;
                btn.classList.toggle('text-[--sims-green-dark]', isActive);
                btn.classList.toggle('text-[--text-secondary]', !isActive);
            });
        }

        const sortByCreated = (a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);

        onSnapshot(collection(db, "residents"), (snapshot) => {
            state.residents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.residents = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "businesses"), (snapshot) => {
            state.businesses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.businesses = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "branches"), (snapshot) => {
            state.branches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.branches = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "closedRecords"), (snapshot) => {
            state.closedRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            state.dataLoaded.closedRecords = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "parties"), (snapshot) => {
            state.parties = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.parties = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "councils"), (snapshot) => {
            state.councils = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.councils = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        // New Snapshot for Laws
        onSnapshot(collection(db, "laws"), (snapshot) => {
            state.laws = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.laws = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "regions"), (snapshot) => {
            state.regions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated);
            state.dataLoaded.regions = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(collection(db, "electionHistory"), (snapshot) => {
            state.electionHistory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            state.dataLoaded.electionHistory = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(doc(db, "config", "sectors"), (doc) => {
            state.customSectors = doc.data()?.list || [];
            state.dataLoaded.customSectors = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(doc(db, "government", "config"), (doc) => {
            state.government.ministries = doc.data()?.ministries || [];
            state.dataLoaded.governmentConfig = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(doc(db, "government", "roles"), (doc) => {
            state.government.roles = doc.data() || {};
            state.dataLoaded.governmentRoles = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        onSnapshot(doc(db, "election", "current"), (doc) => {
            state.election = doc.data() || { isActive: false };
            state.dataLoaded.election = true; checkAllDataLoaded();
            if (state.initialRenderDone) render();
        });

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
